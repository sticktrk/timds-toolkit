name: Update Design System consumer

# Called only after the exact Design System commit has been published. A
# consumer that pins a published version (designSystem.version in
# timds.consumer.json) is moved to this release with its own toolkit, which
# fetches and verifies the published bundle; a consumer that still carries the
# Design System as a git submodule gets its gitlink advanced to the exact
# commit. A Git tag is neither created nor required.
on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      path:
        required: true
        type: string
      repository:
        required: true
        type: string
      sha:
        description: Exact published Design System commit
        required: true
        type: string
      version:
        description: Published Design System version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: Consumer repository base branch
        required: true
        default: main
        type: string
      path:
        description: Design System path in the consumer repository (the submodule path, when it still has one)
        required: true
        default: design-system
        type: string
      repository:
        description: Consumer repository as OWNER/REPOSITORY
        required: true
        type: string
      sha:
        description: Exact published Design System commit
        required: true
        type: string
      version:
        description: Published Design System version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-timds-consumer-${{ inputs.repository }}-${{ inputs.path }}
  cancel-in-progress: false

env:
  UPDATE_BRANCH: automation/update-design-system

jobs:
  update-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require consumer repository token
        env:
          GH_TOKEN: ${{ secrets.TIMDS_CONSUMER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TIMDS_CONSUMER_TOKEN must grant contents and pull-request access to ${{ inputs.repository }}."
            exit 1
          fi

      - name: Check out the exact published Design System commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify release metadata
        id: release
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Invalid version ${INPUT_VERSION}."; exit 1; }
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "Invalid commit ${INPUT_SHA}."; exit 1; }
          resolved_sha="$(git rev-parse HEAD)"
          declared_version="$(node -p "require('./timds.json').version")"
          [[ "$resolved_sha" == "$INPUT_SHA" ]] \
            || { echo "Resolved ${resolved_sha}, expected ${INPUT_SHA}."; exit 1; }
          [[ "$declared_version" == "$INPUT_VERSION" ]] \
            || { echo "Commit declares ${declared_version}, expected ${INPUT_VERSION}."; exit 1; }
          {
            echo "sha=${resolved_sha}"
            echo "version=${INPUT_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out consumer repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.TIMDS_CONSUMER_TOKEN }}
          path: consumer

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Update the Design System pin
        id: update
        working-directory: consumer
        env:
          DESIGN_SYSTEM_SHA: ${{ steps.release.outputs.sha }}
          DESIGN_SYSTEM_VERSION: ${{ steps.release.outputs.version }}
          SUBMODULE_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pinned="$(node -p "try { require('./timds.consumer.json').designSystem.version || '' } catch { '' }")"
          if [[ -n "$pinned" ]]; then
            # A published pin. "current" follows every release on its own.
            if [[ "$pinned" == "current" || "$pinned" == "$DESIGN_SYSTEM_VERSION" ]]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            npm ci --ignore-scripts --no-audit --no-fund
            # Moves designSystem.version and fetches that version's published
            # bundle, verifying every digest, so the pin never names an
            # unpublished release.
            npm run --silent timds -- consumer update "$DESIGN_SYSTEM_VERSION"
            git switch --create "$UPDATE_BRANCH"
            git add -- timds.consumer.json
            git commit -m "chore: update Design System to ${DESIGN_SYSTEM_VERSION}"
            echo "mode=pin" >> "$GITHUB_OUTPUT"
          else
            current_mode="$(git ls-files --stage -- "$SUBMODULE_PATH" | awk '{print $1}')"
            [[ "$current_mode" == "160000" ]] \
              || { echo "$SUBMODULE_PATH is neither a published pin in timds.consumer.json nor a tracked git submodule."; exit 1; }
            current_sha="$(git ls-tree HEAD -- "$SUBMODULE_PATH" | awk '{print $3}')"
            if [[ "$current_sha" == "$DESIGN_SYSTEM_SHA" ]]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git switch --create "$UPDATE_BRANCH"
            git update-index --cacheinfo "160000,$DESIGN_SYSTEM_SHA,$SUBMODULE_PATH"
            git commit -m "chore: update design system to ${DESIGN_SYSTEM_VERSION}"
            echo "mode=submodule" >> "$GITHUB_OUTPUT"
          fi
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the pin update pull request
        if: steps.update.outputs.changed == 'true'
        working-directory: consumer
        env:
          DESIGN_SYSTEM_SHA: ${{ steps.release.outputs.sha }}
          DESIGN_SYSTEM_VERSION: ${{ steps.release.outputs.version }}
          UPDATE_MODE: ${{ steps.update.outputs.mode }}
          GH_TOKEN: ${{ secrets.TIMDS_CONSUMER_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "${{ inputs.repository }}" --base "${{ inputs.branch }}" --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')"
          title="chore: update Design System to ${DESIGN_SYSTEM_VERSION}"
          if [[ "$UPDATE_MODE" == "pin" ]]; then
            summary="Moves the published Design System pin in \`timds.consumer.json\` to version \`${DESIGN_SYSTEM_VERSION}\` (${{ github.repository }}@${DESIGN_SYSTEM_SHA}); \`npm ci\` fetches that version's bundle."
          else
            summary="Advances the pinned \`${{ inputs.path }}\` submodule to version \`${DESIGN_SYSTEM_VERSION}\` (${{ github.repository }}@${DESIGN_SYSTEM_SHA})."
          fi
          body="$(printf '%s\n' \
            "$summary" \
            "" \
            "The release was published before this pull request was opened. Reviewing and deploying the consumer remain separate decisions.")"
          if [[ -n "$pr_number" ]]; then
            gh api --method PATCH "repos/${{ inputs.repository }}/pulls/${pr_number}" \
              -f title="$title" -f body="$body" --jq '.html_url'
            exit 0
          fi
          gh pr create \
            --repo "${{ inputs.repository }}" \
            --base "${{ inputs.branch }}" \
            --head "$UPDATE_BRANCH" \
            --title "$title" \
            --body "$body"
