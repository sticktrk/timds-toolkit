<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{description}}">
    <title>{{title}} · {{name}}</title>
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/styles/system.css">
    <link rel="stylesheet" href="/styles/viewer.css">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="appbar">
      <a class="appbar__brand" href="/">{{name}}</a>
      <nav class="appbar__views" aria-label="Views">
        {{views}}
      </nav>
      <span class="appbar__version">v{{version}}</span>
    </header>

    <div class="layout">
      <nav class="sidenav" aria-label="Pages">
        {{sidenav}}
      </nav>
      <main id="content" class="content">
        {{content}}
        {{pagenav}}
      </main>
    </div>

    <footer class="colophon">Replace starter values with approved client foundations before publication.</footer>
  </body>
</html>
