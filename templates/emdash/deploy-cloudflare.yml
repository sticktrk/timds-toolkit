name: Deploy to Cloudflare

# Written once by `timds consumer scaffold emdash`; this file is the site's to
# change, and `timds upgrade` never touches it. It builds the site against the
# pinned Design System and deploys it to Cloudflare Workers with Wrangler. The
# first deployment creates the D1 database and the R2 bucket named in
# wrangler.jsonc.
#
# The first deployment is started by hand (Actions > Deploy to Cloudflare >
# Run workflow): until its setup is completed, whoever opens /_emdash/admin on
# a deployed EmDash site first creates the administrator. Once that is done,
# set the repository variable CLOUDFLARE_DEPLOY_ON_PUSH to true to deploy
# every push to main.
#
# Secrets (repository or organization):
#   CLOUDFLARE_API_TOKEN             Workers Scripts, D1, and R2 edit on the
#   CLOUDFLARE_ACCOUNT_ID            account.
#   DESIGN_SYSTEM_DEPLOY_KEY         private half of a read-only deploy key on
#                                    the Design System repository, or
#   TIMDS_CONSUMER_SUBMODULE_TOKEN   a token with contents:read on it. One of
#                                    the two is required to build.
#   EMDASH_ENCRYPTION_KEY            optional; uploaded as a Worker secret
#                                    (generate one with `npx emdash secrets
#                                    generate`).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out the pinned Design System
        env:
          DESIGN_SYSTEM_DEPLOY_KEY: ${{ secrets.DESIGN_SYSTEM_DEPLOY_KEY }}
          SUBMODULE_TOKEN: ${{ secrets.TIMDS_CONSUMER_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          ds_path="$(node -p "require('./timds.consumer.json').designSystem?.path || 'design-system'")"
          if [[ -n "${SUBMODULE_TOKEN:-}" ]]; then
            git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=git@github.com:" \
              submodule update --init --depth 1 -- "$ds_path"
          elif [[ -n "${DESIGN_SYSTEM_DEPLOY_KEY:-}" ]]; then
            key_file="$RUNNER_TEMP/design-system-deploy-key"
            trap 'rm -f "$key_file"' EXIT
            install -m 600 /dev/null "$key_file"
            printf '%s\n' "$DESIGN_SYSTEM_DEPLOY_KEY" > "$key_file"
            mkdir -p ~/.ssh
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes" \
              git -c "url.git@github.com:.insteadOf=https://github.com/" \
              submodule update --init --depth 1 -- "$ds_path"
          else
            echo "Set DESIGN_SYSTEM_DEPLOY_KEY or TIMDS_CONSUMER_SUBMODULE_TOKEN so the build can read the private ${ds_path} submodule." >&2
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMDASH_ENCRYPTION_KEY: ${{ secrets.EMDASH_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy this site to Cloudflare." >&2
            exit 1
          fi
          npm run build
          if [[ -n "${EMDASH_ENCRYPTION_KEY:-}" ]]; then
            secrets_file="$RUNNER_TEMP/worker-secrets.json"
            trap 'rm -f "$secrets_file"' EXIT
            install -m 600 /dev/null "$secrets_file"
            node -e 'process.stdout.write(JSON.stringify({ EMDASH_ENCRYPTION_KEY: process.env.EMDASH_ENCRYPTION_KEY }))' > "$secrets_file"
            npx wrangler deploy --secrets-file "$secrets_file"
          else
            npx wrangler deploy
          fi
