name: TimDS consumer preview

# Managed by TimDS (`timds consumer init`); `upgrade` refreshes it while it is
# unmodified. Previews are off by default: opt in with
# TIMDS_PREVIEWS_ENABLED=true and a TIMDS_ACCESS_TOKEN. Otherwise this workflow
# skips checkout, installation, validation, rendering, upload, and comments.
# When enabled, each pull request has its manifest and Design System pin
# validated (a published pin is fetched by npm ci; a submodule pin is checked
# out with the credentials below). Only a pull request that can change how an
# app looks is previewed: each app whose design surface it changes, or every
# app when it moves the Design System pin or changes timds.consumer.json. Such
# an app is previewed (routes x viewports x schemes), published to the TimDS
# portal, and linked from ONE comment per app that later pushes update in
# place. Any other pull request skips the preview job. The design surface is
# checked too, but a pull request that leaves it is not failed (a developer's
# pull request legitimately does): the job warns and the comment says so, so a
# reviewer sees when a design change needs a developer.
#
# Repository secrets:
#   TIMDS_ACCESS_TOKEN               CLI token bound to this client; required
#                                    for previews. Without it nothing is built.
#   DESIGN_SYSTEM_DEPLOY_KEY         private half of a read-only deploy key on
#                                    the Design System repository, or
#   TIMDS_CONSUMER_SUBMODULE_TOKEN   a token with contents:read on it.
#                                    One of the two is required: the job token
#                                    cannot read another private repository.
# Repository variable:
#   TIMDS_PREVIEWS_ENABLED           set to true to enable previews; unset or
#                                    false skips the workflow's jobs.
#
# The designer-change workflow calls this one (workflow_call) with the pull
# request and branch it pushed, because pushes made with the job token do not
# start pull_request workflows.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      pull_request:
        description: Pull request number to preview and comment on
        required: true
        type: string
      ref:
        description: Branch (or commit) to preview
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: timds-consumer-preview-${{ inputs.pull_request || github.event.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Secrets and comment permissions are unavailable to fork pull requests.
    # A workflow_call comes from a workflow in this repository.
    if: >-
      vars.TIMDS_PREVIEWS_ENABLED == 'true'
      && (inputs.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      enabled: ${{ steps.token.outputs.enabled }}
    steps:
      # GitHub does not allow secrets in job-level if expressions. Check only
      # presence here, before allocating any checkout/install/render job.
      - name: Check preview token availability
        id: token
        env:
          HAS_ACCESS_TOKEN: ${{ secrets.TIMDS_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "enabled=${HAS_ACCESS_TOKEN}" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_ACCESS_TOKEN" != "true" ]]; then
            echo "TIMDS_ACCESS_TOKEN is not configured; skipping previews."
          fi

  check:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pinned Design System
        env:
          DESIGN_SYSTEM_DEPLOY_KEY: ${{ secrets.DESIGN_SYSTEM_DEPLOY_KEY }}
          SUBMODULE_TOKEN: ${{ secrets.TIMDS_CONSUMER_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          ds_path="$(node -p "require('./timds.consumer.json').designSystem?.path || 'design-system'")"
          if ! git ls-tree HEAD -- "$ds_path" | grep -q '^160000 '; then
            echo "The Design System is consumed as a published bundle; npm ci fetches the pinned version."
            exit 0
          fi
          if [[ -n "${SUBMODULE_TOKEN:-}" ]]; then
            git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=git@github.com:" \
              submodule update --init --depth 1 -- "$ds_path"
          elif [[ -n "${DESIGN_SYSTEM_DEPLOY_KEY:-}" ]]; then
            key_file="$RUNNER_TEMP/design-system-deploy-key"
            trap 'rm -f "$key_file"' EXIT
            install -m 600 /dev/null "$key_file"
            printf '%s\n' "$DESIGN_SYSTEM_DEPLOY_KEY" > "$key_file"
            mkdir -p ~/.ssh
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes" \
              git -c "url.git@github.com:.insteadOf=https://github.com/" \
              submodule update --init --depth 1 -- "$ds_path"
          else
            echo "Set DESIGN_SYSTEM_DEPLOY_KEY or TIMDS_CONSUMER_SUBMODULE_TOKEN so CI can read the private ${ds_path} submodule." >&2
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the manifest and the pin
        run: npm run timds -- consumer check
      - name: Check the design surface
        id: scope
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          if npm run timds -- consumer check --base "origin/${BASE_REF}"; then
            echo "scope=inside" >> "$GITHUB_OUTPUT"
          else
            echo "scope=outside" >> "$GITHUB_OUTPUT"
            echo "::warning title=TimDS design surface::This pull request changes paths outside the design surface in timds.consumer.json (listed above). A design change must stay inside it; anything else needs a developer."
          fi
      - name: List the apps to preview
        id: apps
        env:
          CHANGED: ${{ steps.scope.outputs.preview-apps }}
        run: |
          # The check names the apps whose look the pull request can change.
          # Every app when it could not (it failed before comparing with the base).
          apps="${CHANGED:-$(node -e "process.stdout.write(JSON.stringify(Object.keys(require('./timds.consumer.json').apps)))")}"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          if [[ "$apps" == "[]" ]]; then
            echo "::notice title=TimDS consumer preview::No app's design surface, Design System pin, or manifest changed, so no preview was built."
          fi

  preview:
    needs: check
    if: needs.check.result == 'success' && needs.check.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.apps) }}
    steps:
      # The pull request's own head commit, so the preview, its commit, and the
      # comment all name the commit a reviewer sees on the branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          # Full history, so the preview can find the merge base to compare with.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pinned Design System
        env:
          DESIGN_SYSTEM_DEPLOY_KEY: ${{ secrets.DESIGN_SYSTEM_DEPLOY_KEY }}
          SUBMODULE_TOKEN: ${{ secrets.TIMDS_CONSUMER_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          ds_path="$(node -p "require('./timds.consumer.json').designSystem?.path || 'design-system'")"
          if ! git ls-tree HEAD -- "$ds_path" | grep -q '^160000 '; then
            echo "The Design System is consumed as a published bundle; npm ci fetches the pinned version."
            exit 0
          fi
          if [[ -n "${SUBMODULE_TOKEN:-}" ]]; then
            git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
              -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=git@github.com:" \
              submodule update --init --depth 1 -- "$ds_path"
          elif [[ -n "${DESIGN_SYSTEM_DEPLOY_KEY:-}" ]]; then
            key_file="$RUNNER_TEMP/design-system-deploy-key"
            trap 'rm -f "$key_file"' EXIT
            install -m 600 /dev/null "$key_file"
            printf '%s\n' "$DESIGN_SYSTEM_DEPLOY_KEY" > "$key_file"
            mkdir -p ~/.ssh
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes" \
              git -c "url.git@github.com:.insteadOf=https://github.com/" \
              submodule update --init --depth 1 -- "$ds_path"
          else
            echo "Set DESIGN_SYSTEM_DEPLOY_KEY or TIMDS_CONSUMER_SUBMODULE_TOKEN so CI can read the private ${ds_path} submodule." >&2
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the preview
        id: preview
        env:
          APP: ${{ matrix.app }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.number }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          TIMDS_ACCESS_TOKEN: ${{ secrets.TIMDS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          npm run timds -- consumer preview --app "$APP" --base "origin/${BASE_REF}" --publish --pull-request "$PULL_REQUEST"
      - name: Upload the preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timds-preview-${{ matrix.app }}
          path: .timds/preview/${{ matrix.app }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Comment the preview link
        if: ${{ !cancelled() }}
        env:
          APP: ${{ matrix.app }}
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.preview.outcome }}
          SCOPE: ${{ needs.check.outputs.scope }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SHA="${SHA:-$(git rev-parse HEAD)}"
          marker="<!-- timds-consumer-preview:${APP} -->"
          if [[ -n "${PREVIEW_URL:-}" ]]; then
            status="**[Open the preview](${PREVIEW_URL})** for \`${SHA:0:7}\`. Every route at each width and color scheme is on its first page."
          elif [[ "$OUTCOME" == "success" ]]; then
            status="The preview for \`${SHA:0:7}\` was not published. Download \`timds-preview-${APP}\` from [the workflow run](${RUN_URL}) and open \`index.html\`."
          else
            status="The preview for \`${SHA:0:7}\` failed. See [the workflow run](${RUN_URL})."
          fi
          if [[ "${SCOPE:-}" == "outside" ]]; then
            status="${status}"$'\n\n'"This pull request also changes paths outside the design surface in \`timds.consumer.json\`; those changes need a developer's review. See the check job in [the workflow run](${RUN_URL})."
          fi
          # The backticks are literal Markdown, not a command substitution.
          # shellcheck disable=SC2016
          body="$(printf '%s\n### Design preview: `%s`\n\n%s\n' "$marker" "$APP" "$status")"
          comment_id="$(gh api --paginate "repos/${REPOSITORY}/issues/${PULL_REQUEST}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${REPOSITORY}/issues/${PULL_REQUEST}/comments" -f body="$body" > /dev/null
          fi
