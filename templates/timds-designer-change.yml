name: TimDS designer change

# Managed by TimDS (`timds consumer init`); `upgrade` refreshes it while it is
# unmodified. A designer asks for a change without setting anything up: the
# TimDS portal opens an issue labeled `timds-design-change` (or comments its
# review notes on a design pull request), and this workflow has Codex make
# the change with the consumer skill on a `design/<issue>-<title>` branch,
# open a DRAFT pull request that closes the issue, and optionally publish a preview.
# A later notes comment on that pull request continues on the same branch.
# Nothing is ever merged; the design surface in timds.consumer.json and the
# Design System pin are checked as in the preview workflow.
#
# Triggers:
#   issues labeled `timds-design-change`
#   issue comments carrying <!-- timds-designer-request --> on a pull request
#     whose branch starts with `design/`, or on an issue with that label
#   workflow_dispatch with a request (and optionally app and pull_request)
# Only repository owners, members, and collaborators can start it, plus the
# bots listed in the TIMDS_DESIGNER_BOTS variable. Fork branches are skipped.
#
# Repository secrets:
#   OPENAI_API_KEY                  OpenAI API project key (repository or
#                                    inherited organization secret).
# Pipeline secrets in the default-branch-only timds-pipeline environment:
#   CF_ACCESS_CLIENT_ID and          Access service-token pair for the follower.
#   CF_ACCESS_CLIENT_SECRET          Set TIMDS_PORTAL_URL to the exact host origin.
#   TIMDS_ACCESS_TOKEN               Legacy token bound to this client; reads and
#                                    resolves the designer's notes and
#                                    publishes the preview. Optional: without it
#                                    Codex uses the notes in the comment.
# Repository secrets for submodule checkout:
#   DESIGN_SYSTEM_DEPLOY_KEY or      read access to the private Design System
#   TIMDS_CONSUMER_SUBMODULE_TOKEN   submodule, as for the preview workflow.
# Repository variables:
#   TIMDS_PORTAL_URL                 exact HTTPS origin installed by consumer init --portal-url.
#   TIMDS_CONSUMER_ID                follower UUID when the credential serves several followers.
#   TIMDS_ACCESS_MODE                protected-api only for directly Access-protected API routes.
#   TIMDS_PREVIEWS_ENABLED           set to true to opt in to previews; also
#                                    requires a pipeline credential.
#   TIMDS_DESIGNER_BOTS              comma-separated bot logins allowed to
#                                    start a change; put the TimDS portal's
#                                    GitHub App bot login here (for example
#                                    `your-portal-app[bot]`).
# Repository settings:
#   the `timds-design-change` label exists, and Settings > Actions > General
#   allows GitHub Actions to create pull requests.
#
# Pushes and pull requests made with the job token do not start other
# workflows, so this workflow calls timds-consumer-preview.yml itself when
# previews are enabled. The called workflow checks token availability first.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request:
        description: The change, in the designer's words
        required: true
        type: string
      app:
        description: App from timds.consumer.json (blank when there is only one)
        required: false
        type: string
      pull_request:
        description: Pull request to continue (blank starts a new change)
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'timds-design-change')
      || (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '<!-- timds-designer-request -->')
        && (github.event.issue.pull_request || contains(github.event.issue.labels.*.name, 'timds-design-change')))
      || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.decide.outputs.allowed }}
      app: ${{ steps.decide.outputs.app }}
      branch: ${{ steps.decide.outputs.branch }}
      default_branch: ${{ steps.decide.outputs.default_branch }}
      issue: ${{ steps.decide.outputs.issue }}
      pull_request: ${{ steps.decide.outputs.pull_request }}
    steps:
      - name: Decide whether this request may change the product
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DESIGNER_BOTS: ${{ vars.TIMDS_DESIGNER_BOTS }}
          DISPATCH_APP: ${{ inputs.app }}
          DISPATCH_PULL_REQUEST: ${{ inputs.pull_request }}
          DISPATCH_REQUEST: ${{ inputs.request }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          event() { jq -r "$1 // \"\"" "$GITHUB_EVENT_PATH"; }
          deny() {
            echo "::notice title=TimDS designer change::$1"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          normalize() { tr '[:upper:]' '[:lower:]' | tr -d '[:space:]' | sed -E 's/\[bot\]$//'; }
          trusted() {
            case "$2" in OWNER|MEMBER|COLLABORATOR) return 0 ;; esac
            local login bot
            login="$(printf '%s' "$1" | normalize)"
            IFS=',' read -ra bots <<< "${DESIGNER_BOTS:-}"
            for bot in ${bots[@]+"${bots[@]}"}; do
              bot="$(printf '%s' "$bot" | normalize)"
              if [[ -n "$bot" && "$bot" == "$login" ]]; then return 0; fi
            done
            return 1
          }
          slugify() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//'
          }
          app_line() {
            { grep -iE '^[[:space:]]*app:[[:space:]]*[A-Za-z0-9][A-Za-z0-9._-]*[[:space:]]*$' || true; } \
              | head -n 1 | sed -E 's/^[[:space:]]*[Aa][Pp][Pp]:[[:space:]]*//; s/[[:space:]]*$//'
          }
          use_pull_request() {
            local number="$1" require_design="$2" pr
            [[ "$number" =~ ^[0-9]+$ ]] || deny "pull_request must be a pull request number."
            pr="$(gh api "repos/${REPOSITORY}/pulls/${number}")" || deny "Pull request #${number} was not found."
            [[ "$(jq -r '.head.repo.full_name // ""' <<< "$pr")" == "$REPOSITORY" ]] || deny "Pull request #${number} comes from a fork; skipped."
            [[ "$(jq -r '.state' <<< "$pr")" == "open" ]] || deny "Pull request #${number} is not open."
            branch="$(jq -r '.head.ref' <<< "$pr")"
            if [[ "$require_design" == "true" && "$branch" != design/* ]]; then
              deny "Pull request #${number} is not a design change (its branch does not start with design/)."
            fi
            pull_request="$number"
          }

          default_branch="$(event '.repository.default_branch')"
          issue=""; pull_request=""; branch=""; app=""
          case "$EVENT_NAME" in
            workflow_dispatch)
              app="$DISPATCH_APP"
              if [[ -n "$DISPATCH_PULL_REQUEST" ]]; then
                use_pull_request "$DISPATCH_PULL_REQUEST" false
              else
                branch="design/run-${GITHUB_RUN_NUMBER}-$(slugify "$(printf '%s' "$DISPATCH_REQUEST" | head -n 1 | cut -c1-80)")"
              fi
              ;;
            issues)
              trusted "$(event '.issue.user.login')" "$(event '.issue.author_association')" \
                || deny "The issue author is not a collaborator or a bot listed in TIMDS_DESIGNER_BOTS."
              [[ "$(event '.issue.state')" == "open" ]] || deny "The issue is closed."
              issue="$(event '.issue.number')"
              app="$(event '.issue.body' | app_line)"
              ;;
            issue_comment)
              trusted "$(event '.comment.user.login')" "$(event '.comment.author_association')" \
                || deny "The comment author is not a collaborator or a bot listed in TIMDS_DESIGNER_BOTS."
              app="$(event '.comment.body' | app_line)"
              if [[ -n "$(event '.issue.pull_request.url')" ]]; then
                use_pull_request "$(event '.issue.number')" true
              else
                [[ "$(event '.issue.state')" == "open" ]] || deny "The issue is closed."
                issue="$(event '.issue.number')"
                [[ -n "$app" ]] || app="$(event '.issue.body' | app_line)"
              fi
              ;;
            *) deny "Unsupported event ${EVENT_NAME}." ;;
          esac

          if [[ -n "$issue" ]]; then branch="design/${issue}-$(slugify "$(event '.issue.title')")"; fi
          if [[ -z "$pull_request" ]]; then branch="${branch%-}"; fi
          [[ "$branch" == design/* || -n "$pull_request" ]] || deny "Could not name a design branch."
          if [[ -z "$pull_request" ]]; then
            pull_request="$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json number,isCrossRepository --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')"
          fi
          [[ "$branch" != "$default_branch" ]] || deny "The default branch cannot receive a designer change."
          git check-ref-format --branch "$branch" >/dev/null || deny "Invalid branch."
          [[ "$app" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || app=""
          {
            echo "allowed=true"
            echo "app=${app}"
            echo "branch=${branch}"
            echo "default_branch=${default_branch}"
            echo "issue=${issue}"
            echo "pull_request=${pull_request}"
          } >> "$GITHUB_OUTPUT"
          echo "Design change on ${branch}${pull_request:+ (pull request #${pull_request})}${issue:+ for issue #${issue}}."

  deliver:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    concurrency:
      group: timds-designer-change-${{ needs.gate.outputs.branch }}
      queue: max
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/timds-designer-run.yml
    with:
      branch: ${{ needs.gate.outputs.branch }}
      app: ${{ needs.gate.outputs.app }}
      issue: ${{ needs.gate.outputs.issue }}
      pull_request: ${{ needs.gate.outputs.pull_request }}
      request: ${{ inputs.request }}
    secrets: inherit
