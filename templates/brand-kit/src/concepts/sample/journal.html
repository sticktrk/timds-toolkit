<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field notes journal</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #F8F4E8; color: #25372E; font: 1rem/1.5 Arial, sans-serif }
    main { max-width: 43rem; margin: auto; padding: 1.5rem 2rem }
    header { border-bottom: 1px solid; padding-bottom: .75rem; display: flex; gap: .75rem; align-items: center }
    h1 { margin: 1rem 0 .5rem; font: 400 clamp(2rem, 6vw, 3.75rem)/1.1 Georgia, serif }
    p { margin: .75rem 0 }
  </style>
</head>
<body>
  <main>
    <header><img src="trail.svg" alt="" width="48" height="32"> Field notes</header>
    <h1>First light on the ridge</h1>
    <p>From the north switchback, the trail disappears into the pines. The last patch of snow sits in their shade.</p>
  </main>
</body>
</html>
