name: TimDS design system

on:
  pull_request:
    paths:
      - "design-system/**"
      - ".agents/skills/timds-edit-design-system/**"
      - ".github/workflows/timds-design-system.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
      - master
    paths:
      - "design-system/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the selected TimDS executable
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er 'select(.schemaVersion == 2 and .mode == "binary" and .executable == "timds-cli") | .version' design-system/.timds/installation.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          directory="$RUNNER_TEMP/timds-bin"
          mkdir -p "$directory"
          asset="timds-cli-v${version}-linux-x64"
          base="https://github.com/sticktrk/timds-toolkit/releases/download/v${version}"
          curl --fail --location "$base/$asset" -o "$directory/$asset"
          curl --fail --location "$base/$asset.sha256" -o "$directory/$asset.sha256"
          (cd "$directory" && sha256sum --strict --check "$asset.sha256")
          chmod +x "$directory/$asset"
          mv "$directory/$asset" "$directory/timds-cli"
          echo "$directory" >> "$GITHUB_PATH"
      - run: timds-cli dependencies check
      - name: Validate exact TimDS artifact
        run: timds-cli check --require-clean-dist
