name: TimDS design system

on:
  pull_request:
    paths:
      - "design-system/**"
      - ".agents/skills/timds-edit-design-system/**"
      - ".github/workflows/timds-design-system.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
      - master
    paths:
      - "design-system/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate exact TimDS artifact
        run: npm run timds -- check --require-clean-dist
