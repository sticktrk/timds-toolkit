name: TimDS design system

# Pull requests validate. Every accepted update to main becomes a release:
# prepare-release advances the patch exactly once unless the pull request
# explicitly advanced the version. Publish ships that exact commit and respects
# automatic updates; the final reusable job advances the linked consumer pin.
# Portal publication needs an unbound operator TIMDS_ACCESS_TOKEN secret; a
# release without it stops before any version advance. Tags are not required.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timds-design-system-${{ github.event_name == 'pull_request' && github.ref || 'main-release' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install the selected TimDS executable
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er 'select(.schemaVersion == 2 and .mode == "binary" and .executable == "timds-cli") | .version' .timds/installation.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          directory="$RUNNER_TEMP/timds-bin"
          mkdir -p "$directory"
          asset="timds-cli-v${version}-linux-x64"
          base="https://github.com/sticktrk/timds-toolkit/releases/download/v${version}"
          curl --fail --location "$base/$asset" -o "$directory/$asset"
          curl --fail --location "$base/$asset.sha256" -o "$directory/$asset.sha256"
          (cd "$directory" && sha256sum --strict --check "$asset.sha256")
          chmod +x "$directory/$asset"
          mv "$directory/$asset" "$directory/timds-cli"
          echo "$directory" >> "$GITHUB_PATH"
      - run: timds-cli dependencies check
      - run: timds-cli run scripts/check-versions.mjs
      - run: timds-cli run --test scripts/prepare-merge-release.test.mjs
      - run: timds-cli check

  prepare-release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      consumer_branch: ${{ steps.prepare.outputs.consumer_branch }}
      consumer_path: ${{ steps.prepare.outputs.consumer_path }}
      consumer_repository: ${{ steps.prepare.outputs.consumer_repository }}
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Require the operator publication token
        env:
          TIMDS_ACCESS_TOKEN: ${{ secrets.TIMDS_ACCESS_TOKEN }}
        run: |
          if [[ -z "${TIMDS_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Configure an unbound operator TIMDS_ACCESS_TOKEN repository secret for portal publication; nothing was versioned or published."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - name: Install the selected TimDS executable
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er 'select(.schemaVersion == 2 and .mode == "binary" and .executable == "timds-cli") | .version' .timds/installation.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          directory="$RUNNER_TEMP/timds-bin"
          mkdir -p "$directory"
          asset="timds-cli-v${version}-linux-x64"
          base="https://github.com/sticktrk/timds-toolkit/releases/download/v${version}"
          curl --fail --location "$base/$asset" -o "$directory/$asset"
          curl --fail --location "$base/$asset.sha256" -o "$directory/$asset.sha256"
          (cd "$directory" && sha256sum --strict --check "$asset.sha256")
          chmod +x "$directory/$asset"
          mv "$directory/$asset" "$directory/timds-cli"
          echo "$directory" >> "$GITHUB_PATH"
      - name: Prepare the merged release
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_NOTE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          consumer_repository="$(timds-cli run -p "require('./timds.json').consumer?.repository || ''")"
          consumer_branch="$(timds-cli run -p "require('./timds.json').consumer?.branch || 'main'")"
          consumer_path="$(timds-cli run -p "require('./timds.json').consumer?.path || 'design-system'")"
          {
            echo "consumer_repository=${consumer_repository}"
            echo "consumer_branch=${consumer_branch}"
            echo "consumer_path=${consumer_path}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}:timds.json" 2>/dev/null; then
            previous_version="$(git show "${BEFORE_SHA}:timds.json" | timds-cli run -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            timds-cli run scripts/prepare-merge-release.mjs \
              --previous "$previous_version" \
              --fallback-note "$RELEASE_NOTE" \
              --github-output "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version=$(timds-cli run -p "require('./timds.json').version")" >> "$GITHUB_OUTPUT"
            echo "Initial contract push or manual dispatch publishes the selected main commit without changing its version."
          fi
      - name: Verify and commit the synchronized version
        id: commit
        env:
          CHANGED: ${{ steps.prepare.outputs.changed }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail

          timds-cli run scripts/check-versions.mjs
          timds-cli run --test scripts/prepare-merge-release.test.mjs
          git diff --check
          if [[ "$CHANGED" == "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md package.json package-lock.json timds.json
            git commit -m "Release ${VERSION}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
      - name: Install the selected TimDS executable
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er 'select(.schemaVersion == 2 and .mode == "binary" and .executable == "timds-cli") | .version' .timds/installation.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          directory="$RUNNER_TEMP/timds-bin"
          mkdir -p "$directory"
          asset="timds-cli-v${version}-linux-x64"
          base="https://github.com/sticktrk/timds-toolkit/releases/download/v${version}"
          curl --fail --location "$base/$asset" -o "$directory/$asset"
          curl --fail --location "$base/$asset.sha256" -o "$directory/$asset.sha256"
          (cd "$directory" && sha256sum --strict --check "$asset.sha256")
          chmod +x "$directory/$asset"
          mv "$directory/$asset" "$directory/timds-cli"
          echo "$directory" >> "$GITHUB_PATH"
      - run: timds-cli dependencies check
      - run: timds-cli check
      - name: Upload the machine index to the CDN
        env:
          TIMDS_ACCESS_TOKEN: ${{ secrets.TIMDS_ACCESS_TOKEN }}
        run: |
          if [[ -z "${TIMDS_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Configure an unbound operator TIMDS_ACCESS_TOKEN for portal publication."
            exit 1
          fi
          timds-cli extract --skip-build --publish
      - name: Publish exact TimDS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          timds-cli artifact publish
      - name: Publish or stage the portal release and verify the public root
        env:
          TIMDS_ACCESS_TOKEN: ${{ secrets.TIMDS_ACCESS_TOKEN }}
        run: timds-cli publish --skip-build --skip-push

  pin-consumer:
    needs: [prepare-release, publish]
    if: needs.prepare-release.outputs.consumer_repository != ''
    uses: ./.github/workflows/update-consumer-submodule.yml
    with:
      branch: ${{ needs.prepare-release.outputs.consumer_branch }}
      path: ${{ needs.prepare-release.outputs.consumer_path }}
      repository: ${{ needs.prepare-release.outputs.consumer_repository }}
      sha: ${{ needs.prepare-release.outputs.sha }}
      version: ${{ needs.prepare-release.outputs.version }}
    secrets: inherit
